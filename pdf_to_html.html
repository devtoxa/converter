<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure PDF to HTML Converter (No Canvas)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #181c24;
      --muted: #647084;
      --border: #dce2ec;
      --accent: #2563eb;
      --stage-width: 960px;
    }

    body.dark {
      --bg: #0f131a;
      --surface: #171d28;
      --text: #e6ecf5;
      --muted: #8b97ad;
      --border: #273142;
      --accent: #4f8cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Malgun Gothic", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .path-form {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 260px;
    }

    .path-form input[type="text"] {
      flex: 1;
      min-width: 180px;
    }

    button, input[type="text"], input[type="search"], .file-label {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }

    button, .file-label {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    button.active, button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px 40px;
      gap: 14px;
    }

    .search-bar {
      width: min(100%, var(--stage-width));
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-bar input {
      flex: 1;
      background: var(--surface);
    }

    .stage {
      width: min(100%, var(--stage-width));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: width 0.2s ease;
    }

    .rendered-html-page {
      position: relative;
      background: #ffffff;
      color: #111827;
      border: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .pdf-shape {
      position: absolute;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .pdf-text-run {
      position: absolute;
      white-space: pre;
      line-height: 1;
      margin: 0;
      padding: 0;
      color: #111827;
      letter-spacing: -0.02em;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }

    .pdf-text-run::selection,
    .pdf-text-run *::selection {
      background: #bfdbfe;
      color: #111827;
    }

    .pdf-text-run.bold {
      font-weight: 700;
    }

    .pdf-text-run.mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: rgba(15, 23, 42, 0.05);
      border-radius: 2px;
    }

    .pdf-text-run mark {
      background: #fde047;
      color: #111827;
      border-radius: 2px;
    }

    .status-box {
      width: 100%;
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
    }

    .hits {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12px;
    }

    .hit-btn {
      padding: 4px 8px;
      font-size: 12px;
    }

    .html-preview-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .html-preview-box textarea {
      width: 100%;
      min-height: 160px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      resize: vertical;
    }

    .bottom-left-dropdown {
      position: fixed;
      left: 16px;
      bottom: 16px;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .dropdown-menu-panel {
      display: none;
      flex-direction: column;
      min-width: 196px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      gap: 4px;
    }

    .bottom-left-dropdown.open .dropdown-menu-panel {
      display: flex;
    }

    .dropdown-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .dropdown-item-btn:hover:not(:disabled) {
      background: var(--bg);
      border-color: var(--border);
    }

    .dropdown-trigger-btn {
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
      font-weight: 600;
    }

    .toast-feedback {
      position: fixed;
      left: 16px;
      bottom: 64px;
      z-index: 50;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      opacity: 0;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast-feedback.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="toolbar-row">
      <strong>Pure PDF → HTML Renderer (No Canvas)</strong>

      <form id="pathForm" class="path-form">
        <input
          id="pathInput"
          type="text"
          placeholder="PDF 경로 또는 URL 입력 (예: /.pdf/md_to_pdf.pdf 또는 https://...)"
          autocomplete="off"
        />
        <button type="submit" class="primary">HTML로 변환</button>
        <label class="file-label" title="로컬 PDF 파일 열기">
          파일 선택
          <input id="fileInput" type="file" accept="application/pdf" hidden />
        </label>
      </form>
    </div>

    <div class="toolbar-row">
      <div class="group">
        <button id="prevBtn" type="button" disabled>이전</button>
        <span id="pageIndicator">0 / 0</span>
        <button id="nextBtn" type="button" disabled>다음</button>
        <button id="copyHtmlBtn" type="button" disabled>HTML 코드 복사</button>
        <button id="downloadHtmlBtn" type="button" disabled>HTML 파일 저장</button>
      </div>

      <div class="group">
        <button id="themeBtn" type="button">다크 모드</button>
        <button type="button" data-width="960px" class="active">PC</button>
        <button type="button" data-width="720px">탭</button>
        <button type="button" data-width="412px">스마트폰</button>
      </div>
    </div>
  </header>

  <main>
    <div class="search-bar">
      <input id="searchInput" type="search" placeholder="변환된 HTML DOM 텍스트에서 키워드 검색..." />
      <button id="clearSearchBtn" type="button">초기화</button>
    </div>

    <section class="stage" id="stage">
      <div id="statusBox" class="status-box">
        상단 입력창에 PDF 경로 또는 URL을 입력하거나 <code>?path=...</code> 파라미터를 지정해주세요.<br />
        예시: <code>/.pdf/md_to_pdf.pdf</code>
      </div>

      <div id="pageHost" style="width: 100%; display: flex; justify-content: center;" hidden></div>
      <div id="hitsBox" class="hits"></div>

      <div id="htmlSourceWrap" class="html-preview-box" hidden>
        <strong>렌더링된 순수 HTML 소스 (Canvas 태그 0개)</strong>
        <textarea id="htmlSourceArea" readonly></textarea>
      </div>
    </section>
  </main>

  <div id="bottomLeftDropdown" class="bottom-left-dropdown">
    <div id="bottomLeftMenu" class="dropdown-menu-panel" role="menu">
      <button id="menuHtmlActionBtn" type="button" class="dropdown-item-btn" disabled>
        <span>HTML 다운로드</span>
        <span>.html</span>
      </button>
      <button id="menuPdfActionBtn" type="button" class="dropdown-item-btn" disabled>
        <span>PDF 다운로드</span>
        <span>.pdf</span>
      </button>
      <button id="menuDownloadBtn" type="button" class="dropdown-item-btn" disabled>
        <span>다운로드 (선택 형식)</span>
        <span>저장</span>
      </button>
      <button id="menuCopyUrlBtn" type="button" class="dropdown-item-btn">
        <span>URL 복사</span>
        <span>복사</span>
      </button>
    </div>
    <button id="bottomLeftToggleBtn" type="button" class="primary dropdown-trigger-btn" aria-expanded="false">
      내보내기 · URL 메뉴 ▴
    </button>
  </div>
  <div id="toastFeedback" class="toast-feedback"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const OPS = pdfjsLib.OPS;

    const state = {
      pdfDoc: null,
      docTitle: "converted",
      pageNum: 1,
      totalPages: 0,
      pagesText: [],
      sourceBytes: null,
      sourceUrl: "",
      rendering: false,
      pendingPage: null
    };

    const el = {
      pathForm: document.getElementById("pathForm"),
      pathInput: document.getElementById("pathInput"),
      fileInput: document.getElementById("fileInput"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      pageIndicator: document.getElementById("pageIndicator"),
      copyHtmlBtn: document.getElementById("copyHtmlBtn"),
      downloadHtmlBtn: document.getElementById("downloadHtmlBtn"),
      themeBtn: document.getElementById("themeBtn"),
      searchInput: document.getElementById("searchInput"),
      clearSearchBtn: document.getElementById("clearSearchBtn"),
      stage: document.getElementById("stage"),
      statusBox: document.getElementById("statusBox"),
      pageHost: document.getElementById("pageHost"),
      hitsBox: document.getElementById("hitsBox"),
      htmlSourceWrap: document.getElementById("htmlSourceWrap"),
      htmlSourceArea: document.getElementById("htmlSourceArea")
    };

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(rawText, query) {
      if (!query) return escapeHtml(rawText);
      return escapeHtml(rawText).replace(
        new RegExp("(" + escapeRegExp(escapeHtml(query)) + ")", "gi"),
        "<mark>$1" + "<" + "/mark>"
      );
    }

    function getTargetPathFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const raw = params.get("path");
      return raw ? raw.trim() : "";
    }

    function syncUrlParam(targetPath) {
      const url = new URL(window.location.href);
      if (targetPath) {
        url.searchParams.set("path", targetPath);
      } else {
        url.searchParams.delete("path");
      }
      window.history.replaceState({}, "", url.toString());
    }

    function resolvePdfUrl(rawPath) {
      if (/^https?:\/\//i.test(rawPath)) return rawPath;
      return new URL(rawPath, window.location.origin).href;
    }

    function setStatus(html) {
      el.statusBox.innerHTML = html;
      el.statusBox.hidden = false;
      el.pageHost.hidden = true;
      el.htmlSourceWrap.hidden = true;
      el.copyHtmlBtn.disabled = true;
      el.downloadHtmlBtn.disabled = true;
      if (typeof syncExportMenuState === "function") syncExportMenuState();
    }

    function showPageContainer() {
      el.statusBox.hidden = true;
      el.pageHost.hidden = false;
      el.htmlSourceWrap.hidden = false;
      el.copyHtmlBtn.disabled = false;
      el.downloadHtmlBtn.disabled = false;
      if (typeof syncExportMenuState === "function") syncExportMenuState();
    }

    function updatePager() {
      el.pageIndicator.textContent = (state.totalPages ? state.pageNum : 0) + " / " + state.totalPages;
      el.prevBtn.disabled = !state.pdfDoc || state.pageNum <= 1;
      el.nextBtn.disabled = !state.pdfDoc || state.pageNum >= state.totalPages;
    }

    function multiplyMatrix(m1, m2) {
      return [
        m1[0] * m2[0] + m1[1] * m2[2],
        m1[0] * m2[1] + m1[1] * m2[3],
        m1[2] * m2[0] + m1[3] * m2[2],
        m1[2] * m2[1] + m1[3] * m2[3],
        m1[4] * m2[0] + m1[5] * m2[2] + m2[4],
        m1[4] * m2[1] + m1[5] * m2[3] + m2[5]
      ];
    }

    function transformPoint(m, x, y) {
      return [
        m[0] * x + m[2] * y + m[4],
        m[1] * x + m[3] * y + m[5]
      ];
    }

    function rgbToCss(args) {
      if (!args || args.length < 3) return "#000000";
      const r = args[0], g = args[1], b = args[2];
      const to255 = (v) => (v <= 1 ? Math.round(v * 255) : Math.round(v));
      return "rgb(" + to255(r) + ", " + to255(g) + ", " + to255(b) + ")";
    }

    function grayToCss(args) {
      const g = args && args.length ? args[0] : 0;
      const val = g <= 1 ? Math.round(g * 255) : Math.round(g);
      return "rgb(" + val + ", " + val + ", " + val + ")";
    }

    function parseRgbString(rgbStr) {
      const m = rgbStr && rgbStr.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
      if (!m) return null;
      return { r: Number(m[1]), g: Number(m[2]), b: Number(m[3]) };
    }

    function isDarkColor(rgbStr) {
      const c = parseRgbString(rgbStr);
      if (!c) return false;
      const luma = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
      return luma < 95;
    }

    function extractVectorShapesAsHtml(opList, viewport) {
      const shapes = [];
      const shapeBoxes = [];
      let ctm = [1, 0, 0, 1, 0, 0];
      const stack = [];
      let fillColor = "#ffffff";
      let strokeColor = "#cbd5e1";
      let lineWidth = 1;
      let pathRects = [];
      let pathSegments = [];
      let curX = 0;
      let curY = 0;

      const toViewportRect = (x, y, w, h) => {
        const m = multiplyMatrix(ctm, viewport.transform);
        const p1 = transformPoint(m, x, y);
        const p2 = transformPoint(m, x + w, y + h);
        return {
          left: Math.min(p1[0], p2[0]),
          top: Math.min(p1[1], p2[1]),
          width: Math.abs(p2[0] - p1[0]),
          height: Math.abs(p2[1] - p1[1])
        };
      };

      const pushRectElement = (r, hasStroke) => {
        if (r.width < 0.5 && r.height < 0.5) return;
        if (
          r.width >= viewport.width * 0.98 &&
          r.height >= viewport.height * 0.98 &&
          fillColor === "rgb(255, 255, 255)"
        ) {
          return;
        }
        const left = Number(r.left.toFixed(1));
        const top = Number(r.top.toFixed(1));
        const width = Number(Math.max(1, r.width).toFixed(1));
        const height = Number(Math.max(1, r.height).toFixed(1));

        const div = document.createElement("div");
        div.className = "pdf-shape";
        div.style.left = left + "px";
        div.style.top = top + "px";
        div.style.width = width + "px";
        div.style.height = height + "px";
        div.style.backgroundColor = fillColor;
        if (hasStroke) {
          div.style.border = Math.max(1, Math.round(lineWidth)) + "px solid " + strokeColor;
        }
        shapes.push(div);
        shapeBoxes.push({ left, top, width, height, fillColor });
      };

      const fnArray = opList.fnArray;
      const argsArray = opList.argsArray;
      for (let i = 0; i < fnArray.length; i++) {
        const fn = fnArray[i];
        const args = argsArray[i];

        if (fn === OPS.save) {
          stack.push({ ctm: ctm.slice(), fillColor, strokeColor, lineWidth });
        } else if (fn === OPS.restore) {
          const prev = stack.pop();
          if (prev) {
            ctm = prev.ctm;
            fillColor = prev.fillColor;
            strokeColor = prev.strokeColor;
            lineWidth = prev.lineWidth;
          }
        } else if (fn === OPS.transform) {
          ctm = multiplyMatrix(args, ctm);
        } else if (fn === OPS.setFillRGBColor) {
          fillColor = rgbToCss(args);
        } else if (fn === OPS.setFillGray) {
          fillColor = grayToCss(args);
        } else if (fn === OPS.setStrokeRGBColor) {
          strokeColor = rgbToCss(args);
        } else if (fn === OPS.setStrokeGray) {
          strokeColor = grayToCss(args);
        } else if (fn === OPS.setLineWidth) {
          lineWidth = Math.max(1, (args[0] || 1) * viewport.scale);
        } else if (fn === OPS.rectangle) {
          pathRects.push(toViewportRect(args[0], args[1], args[2], args[3]));
        } else if (fn === OPS.constructPath) {
          const subOps = args[0] || [];
          const coords = args[1] || [];
          let ci = 0;
          for (let s = 0; s < subOps.length; s++) {
            const sub = subOps[s];
            if (sub === OPS.rectangle) {
              pathRects.push(toViewportRect(coords[ci], coords[ci + 1], coords[ci + 2], coords[ci + 3]));
              ci += 4;
            } else if (sub === OPS.moveTo) {
              curX = coords[ci];
              curY = coords[ci + 1];
              ci += 2;
            } else if (sub === OPS.lineTo) {
              const nx = coords[ci];
              const ny = coords[ci + 1];
              pathSegments.push({ x1: curX, y1: curY, x2: nx, y2: ny });
              curX = nx;
              curY = ny;
              ci += 2;
            }
          }
        } else if (fn === OPS.fill || fn === OPS.eoFill || fn === OPS.fillStroke || fn === OPS.eoFillStroke) {
          const hasStroke = fn === OPS.fillStroke || fn === OPS.eoFillStroke;
          for (const r of pathRects) {
            pushRectElement(r, hasStroke);
          }
          pathRects = [];
          pathSegments = [];
        } else if (fn === OPS.stroke) {
          for (const r of pathRects) {
            pushRectElement(r, true);
          }
          for (const seg of pathSegments) {
            const m = multiplyMatrix(ctm, viewport.transform);
            const p1 = transformPoint(m, seg.x1, seg.y1);
            const p2 = transformPoint(m, seg.x2, seg.y2);
            const w = Math.abs(p2[0] - p1[0]);
            const h = Math.abs(p2[1] - p1[1]);
            if (w < 1.5 || h < 1.5) {
              const line = document.createElement("div");
              line.className = "pdf-shape";
              line.style.left = Math.min(p1[0], p2[0]).toFixed(1) + "px";
              line.style.top = Math.min(p1[1], p2[1]).toFixed(1) + "px";
              line.style.width = Math.max(1, w).toFixed(1) + "px";
              line.style.height = Math.max(1, h).toFixed(1) + "px";
              line.style.backgroundColor = strokeColor;
              shapes.push(line);
            }
          }
          pathRects = [];
          pathSegments = [];
        } else if (fn === OPS.endPath) {
          pathRects = [];
          pathSegments = [];
        }
      }

      return { shapes, shapeBoxes };
    }

    function resolveTextColorOverShapes(run, shapeBoxes) {
      const approxWidth = Math.max(12, run.right - run.left);
      const cx = run.left + approxWidth * 0.5;
      const cy = run.top + run.fontHeight * 0.5;

      for (let i = shapeBoxes.length - 1; i >= 0; i--) {
        const box = shapeBoxes[i];
        const insideX = cx >= box.left && cx <= box.left + box.width;
        const insideY = cy >= box.top && cy <= box.top + box.height;
        if (insideX && insideY) {
          if (isDarkColor(box.fillColor)) {
            return "#ffffff";
          }
          return "#111827";
        }
      }
      return "#111827";
    }

    function buildMergedHtmlTextNodes(textContent, viewport, searchQuery, shapeBoxes) {
      if (shapeBoxes === undefined) shapeBoxes = [];
      const styles = textContent.styles || {};

      const rawItems = textContent.items
        .filter((item) => "str" in item && item.str.length > 0)
        .map((item) => {
          const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
          const fontHeight = Math.hypot(tx[2], tx[3]) || Math.abs(tx[3]) || 12;
          const width = (item.width || 0) * viewport.scale;
          const styleInfo = styles[item.fontName] || {};
          const fontFamily = (styleInfo.fontFamily || item.fontName || "").toLowerCase();
          const isBold = /bold|black|heavy|700|800/i.test(fontFamily);
          const isMono = /mono|consolas|courier|code/i.test(fontFamily);

          return {
            str: item.str,
            left: tx[4],
            baselineY: tx[5],
            top: tx[5] - fontHeight * 0.86,
            fontHeight,
            width,
            isBold,
            isMono
          };
        })
        .sort((a, b) => {
          if (Math.abs(a.baselineY - b.baselineY) > 3) return a.baselineY - b.baselineY;
          return a.left - b.left;
        });

      const mergedRuns = [];
      for (const item of rawItems) {
        if (!item.str.trim() && mergedRuns.length) {
          mergedRuns[mergedRuns.length - 1].str += " ";
          mergedRuns[mergedRuns.length - 1].right += item.width || item.fontHeight * 0.3;
          continue;
        }
        if (!item.str.trim()) continue;

        const prev = mergedRuns[mergedRuns.length - 1];
        const sameRow = prev && Math.abs(prev.baselineY - item.baselineY) <= Math.max(3, item.fontHeight * 0.3);
        const gap = prev ? item.left - prev.right : Infinity;
        const isAdjacent = sameRow && gap >= -2 && gap <= Math.max(18, item.fontHeight * 1.4);

        if (isAdjacent) {
          const needsSpace = gap > item.fontHeight * 0.18 && !prev.str.endsWith(" ") && !item.str.startsWith(" ");
          prev.str += (needsSpace ? " " : "") + item.str;
          prev.right = Math.max(prev.right, item.left + item.width);
          prev.fontHeight = Math.max(prev.fontHeight, item.fontHeight);
          prev.isBold = prev.isBold || item.isBold;
        } else {
          mergedRuns.push({
            str: item.str,
            left: item.left,
            top: item.top,
            baselineY: item.baselineY,
            right: item.left + (item.width || item.str.length * item.fontHeight * 0.55),
            fontHeight: item.fontHeight,
            isBold: item.isBold,
            isMono: item.isMono
          });
        }
      }

      return mergedRuns.map((run) => {
        const textColor = resolveTextColorOverShapes(run, shapeBoxes);
        const span = document.createElement("span");
        span.className = "pdf-text-run" + (run.isBold ? " bold" : "") + (run.isMono ? " mono" : "");
        span.style.left = run.left.toFixed(1) + "px";
        span.style.top = run.top.toFixed(1) + "px";
        span.style.fontSize = run.fontHeight.toFixed(1) + "px";
        span.style.color = textColor;
        if (run.isMono && textColor === "#ffffff") {
          span.style.backgroundColor = "rgba(255, 255, 255, 0.14)";
        }
        span.innerHTML = highlightText(run.str, searchQuery);
        return span;
      });
    }

    function preventSelectionOverlap(pageDiv) {
      const runs = Array.from(pageDiv.querySelectorAll(".pdf-text-run"));
      runs.sort((a, b) => {
        const topDiff = parseFloat(a.style.top) - parseFloat(b.style.top);
        if (Math.abs(topDiff) > 4) return topDiff;
        return parseFloat(a.style.left) - parseFloat(b.style.left);
      });

      for (let i = 1; i < runs.length; i++) {
        const prev = runs[i - 1];
        const curr = runs[i];

        const prevTop = parseFloat(prev.style.top);
        const currTop = parseFloat(curr.style.top);
        const prevHeight = prev.offsetHeight || parseFloat(prev.style.fontSize);

        if (Math.abs(currTop - prevTop) < prevHeight * 0.6) {
          const prevRight = parseFloat(prev.style.left) + prev.offsetWidth;
          const currLeft = parseFloat(curr.style.left);
          if (currLeft < prevRight + 2) {
            curr.style.left = (prevRight + 2).toFixed(1) + "px";
          }
        }
      }
    }

    async function extractAllText(pdfDoc) {
      const texts = [];
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page = await pdfDoc.getPage(i);
        const content = await page.getTextContent();
        const text = content.items
          .filter((item) => "str" in item)
          .map((item) => item.str)
          .join(" ")
          .replace(/\s+/g, " ")
          .trim();
        texts.push({ pageNo: i, text });
      }
      state.pagesText = texts;
    }

    async function renderPureHtmlPage(num) {
      if (!state.pdfDoc) return;
      state.rendering = true;

      const query = el.searchInput.value.trim();
      const page = await state.pdfDoc.getPage(num);
      const stageInnerWidth = Math.max(300, el.stage.clientWidth - 34);
      const unscaledViewport = page.getViewport({ scale: 1 });
      const scale = Math.max(0.45, Math.min(1.8, stageInnerWidth / unscaledViewport.width));
      const viewport = page.getViewport({ scale });

      const pageDiv = document.createElement("div");
      pageDiv.className = "rendered-html-page";
      pageDiv.dataset.pageNo = String(num);
      pageDiv.style.width = Math.floor(viewport.width) + "px";
      pageDiv.style.height = Math.floor(viewport.height) + "px";

      const results = await Promise.all([
        page.getOperatorList(),
        page.getTextContent()
      ]);
      const opList = results[0];
      const textContent = results[1];

      const { shapes: shapeElements, shapeBoxes } = extractVectorShapesAsHtml(opList, viewport);
      shapeElements.forEach((shape) => pageDiv.appendChild(shape));

      const textElements = buildMergedHtmlTextNodes(textContent, viewport, query, shapeBoxes);
      textElements.forEach((node) => pageDiv.appendChild(node));

      el.pageHost.innerHTML = "";
      el.pageHost.appendChild(pageDiv);
      showPageContainer();

      preventSelectionOverlap(pageDiv);

      el.htmlSourceArea.value = pageDiv.outerHTML;
      state.pageNum = num;
      state.rendering = false;
      updatePager();

      if (state.pendingPage !== null) {
        const next = state.pendingPage;
        state.pendingPage = null;
        renderPureHtmlPage(next);
      }
    }

    function queueRenderPage(num) {
      if (state.rendering) {
        state.pendingPage = num;
      } else {
        renderPureHtmlPage(num);
      }
    }

    function runSearch() {
      const rawQ = el.searchInput.value.trim();
      const q = rawQ.toLowerCase();
      el.hitsBox.innerHTML = "";

      if (state.pdfDoc && !state.rendering) {
        queueRenderPage(state.pageNum);
      }

      if (!q || !state.pagesText.length) return;

      const matched = state.pagesText.filter((p) => p.text.toLowerCase().includes(q));
      if (!matched.length) {
        el.hitsBox.innerHTML = "<span>\"" + escapeHtml(rawQ) + "\" 일치 페이지 없음" + "<" + "/span>";
        return;
      }

      matched.forEach((m) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "hit-btn";
        btn.textContent = m.pageNo + "페이지 이동";
        btn.addEventListener("click", () => queueRenderPage(m.pageNo));
        el.hitsBox.appendChild(btn);
      });
    }

    async function loadFromDocumentSource(source, displayLabel) {
      state.pdfDoc = null;
      state.docTitle = displayLabel.split("/").pop().replace(/\.pdf$/i, "") || "converted";
      state.totalPages = 0;
      state.pageNum = 1;
      state.pagesText = [];
      state.sourceBytes = null;
      el.hitsBox.innerHTML = "";
      updatePager();
      setStatus("PDF → 순수 HTML DOM 변환 중... (<code>" + escapeHtml(displayLabel) + "<" + "/code>)");

      if (typeof source === "string") {
        state.sourceUrl = source;
        try {
          const resp = await fetch(source);
          if (resp.ok) {
            const ab = await resp.arrayBuffer();
            state.sourceBytes = new Uint8Array(ab);
          }
        } catch (_e) {}
      } else if (source && source.data) {
        state.sourceBytes = new Uint8Array(source.data.slice ? source.data.slice(0) : source.data);
      }
      const loadedDoc = await pdfjsLib.getDocument(source).promise;
      state.pdfDoc = loadedDoc;
      state.totalPages = loadedDoc.numPages;
      state.pageNum = 1;
      updatePager();

      await extractAllText(loadedDoc);
      await renderPureHtmlPage(1);
      if (el.searchInput.value.trim()) runSearch();
    }

    async function loadPdfByPath(rawPath, shouldSyncUrl) {
      if (shouldSyncUrl === undefined) shouldSyncUrl = true;
      const targetPath = rawPath.trim();
      if (!targetPath) {
        setStatus("상단 입력창에 PDF 경로 또는 URL을 입력해주세요.<br />예시: <code>/.pdf/md_to_pdf.pdf" + "<" + "/code>");
        return;
      }

      el.pathInput.value = targetPath;
      if (shouldSyncUrl) syncUrlParam(targetPath);

      const primaryUrl = resolvePdfUrl(targetPath);
      const fallbackUrl = !targetPath.startsWith("http")
        ? new URL(targetPath.replace(/^\/+/, ""), window.location.href).href
        : null;

      try {
        try {
          await loadFromDocumentSource(primaryUrl, targetPath);
        } catch (firstErr) {
          if (!fallbackUrl || fallbackUrl === primaryUrl) throw firstErr;
          await loadFromDocumentSource(fallbackUrl, targetPath);
        }
      } catch (err) {
        setStatus(
          "PDF 로드 실패: <code>" + escapeHtml(targetPath) + "<" + "/code><br />" +
          "경로 존재 여부 및 CORS 허용 여부를 확인해주세요.<br />" +
          "<small>" + escapeHtml(err && err.message ? err.message : String(err)) + "<" + "/small>"
        );
      }
    }

    function buildStandaloneHtmlDocument() {
      const bodyMarkup = el.htmlSourceArea.value;
      const docOpen = "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\" />\n";
      const docTitleTag = "<title>" + escapeHtml(state.docTitle) + " - Page " + state.pageNum + "<" + "/title>\n";
      const docStyle = [
        "<style>",
        "  body { margin: 24px; background: #f1f5f9; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; display: flex; justify-content: center; }",
        "  .rendered-html-page { position: relative; background: #fff; color: #111827; box-shadow: 0 4px 20px rgba(0,0,0,.08); overflow: hidden; user-select: none; }",
        "  .pdf-shape { position: absolute; pointer-events: none; user-select: none; }",
        "  .pdf-text-run { position: absolute; white-space: pre; line-height: 1; letter-spacing: -0.02em; user-select: text; }",
        "  .pdf-text-run::selection { background: #bfdbfe; color: #111827; }",
        "  .pdf-text-run.bold { font-weight: 700; }",
        "  .pdf-text-run.mono { font-family: Consolas, monospace; background: rgba(15,23,42,.05); border-radius: 2px; }",
        "<" + "/style>\n<" + "/head>\n<body>\n"
      ].join("\n");
      const docClose = "\n<" + "/body>\n<" + "/html>";
      return docOpen + docTitleTag + docStyle + bodyMarkup + docClose;
    }

    el.pathForm.addEventListener("submit", (e) => {
      e.preventDefault();
      loadPdfByPath(el.pathInput.value, true);
    });

    el.fileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      el.pathInput.value = file.name;
      syncUrlParam("");
      try {
        const buffer = await file.arrayBuffer();
        await loadFromDocumentSource({ data: buffer }, file.name);
      } catch (err) {
        setStatus("로컬 PDF 로드 실패: <small>" + escapeHtml(err && err.message ? err.message : String(err)) + "<" + "/small>");
      }
    });

    el.copyHtmlBtn.addEventListener("click", async () => {
      if (!el.htmlSourceArea.value) return;
      await navigator.clipboard.writeText(buildStandaloneHtmlDocument());
      const orig = el.copyHtmlBtn.textContent;
      el.copyHtmlBtn.textContent = "복사됨!";
      setTimeout(() => { el.copyHtmlBtn.textContent = orig; }, 1200);
    });

    el.downloadHtmlBtn.addEventListener("click", () => {
      if (!el.htmlSourceArea.value) return;
      const blob = new Blob([buildStandaloneHtmlDocument()], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = state.docTitle + "_p" + state.pageNum + ".html";
      a.click();
      URL.revokeObjectURL(url);
    });

    el.prevBtn.addEventListener("click", () => {
      if (state.pageNum > 1) queueRenderPage(state.pageNum - 1);
    });

    el.nextBtn.addEventListener("click", () => {
      if (state.pageNum < state.totalPages) queueRenderPage(state.pageNum + 1);
    });

    el.themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
    });

    document.querySelectorAll("button[data-width]").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("button[data-width]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        document.documentElement.style.setProperty("--stage-width", btn.dataset.width);
        if (state.pdfDoc) queueRenderPage(state.pageNum);
      });
    });

    el.searchInput.addEventListener("input", runSearch);
    el.clearSearchBtn.addEventListener("click", () => {
      el.searchInput.value = "";
      runSearch();
    });

    window.addEventListener("DOMContentLoaded", () => {
      const initialPath = getTargetPathFromUrl();
      if (initialPath) {
        loadPdfByPath(initialPath, false);
      }
    });

    const exportEl = {
      dropdown: document.getElementById("bottomLeftDropdown"),
      toggleBtn: document.getElementById("bottomLeftToggleBtn"),
      menu: document.getElementById("bottomLeftMenu"),
      htmlBtn: document.getElementById("menuHtmlActionBtn"),
      pdfBtn: document.getElementById("menuPdfActionBtn"),
      downloadBtn: document.getElementById("menuDownloadBtn"),
      copyUrlBtn: document.getElementById("menuCopyUrlBtn"),
      toast: document.getElementById("toastFeedback")
    };

    let selectedExportType = "html";

    function showToast(msg) {
      if (!exportEl.toast) return;
      exportEl.toast.textContent = msg;
      exportEl.toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        exportEl.toast.classList.remove("show");
      }, 1600);
    }

    function syncExportMenuState() {
      const hasRendered = Boolean(state.pdfDoc && el.htmlSourceArea && el.htmlSourceArea.value);
      const hasPdfBytes = Boolean(state.sourceBytes || state.sourceUrl);
      if (exportEl.htmlBtn) exportEl.htmlBtn.disabled = !hasRendered;
      if (exportEl.pdfBtn) exportEl.pdfBtn.disabled = !hasPdfBytes;
      if (exportEl.downloadBtn) {
        exportEl.downloadBtn.disabled = selectedExportType === "pdf" ? !hasPdfBytes : !hasRendered;
        exportEl.downloadBtn.innerHTML =
          "<span>다운로드 (" + (selectedExportType === "pdf" ? "PDF" : "HTML") + ")" + "<" + "/span><span>저장" + "<" + "/span>";
      }
    }

    function triggerHtmlDownload() {
      if (!el.htmlSourceArea.value) return;
      const blob = new Blob([buildStandaloneHtmlDocument()], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = state.docTitle + "_p" + state.pageNum + ".html";
      a.click();
      URL.revokeObjectURL(url);
      showToast("HTML 파일 다운로드 완료");
    }

    async function triggerPdfDownload() {
      if (state.sourceBytes) {
        const blob = new Blob([state.sourceBytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = (state.docTitle || "document") + ".pdf";
        a.click();
        URL.revokeObjectURL(url);
        showToast("PDF 파일 다운로드 완료");
        return;
      }
      if (state.sourceUrl) {
        const a = document.createElement("a");
        a.href = state.sourceUrl;
        a.download = (state.docTitle || "document") + ".pdf";
        a.target = "_blank";
        a.rel = "noopener";
        a.click();
        showToast("PDF 다운로드 요청됨");
      }
    }

    async function copyCurrentUrl() {
      const currentUrl = window.location.href;
      try {
        await navigator.clipboard.writeText(currentUrl);
      } catch (_err) {
        const ta = document.createElement("textarea");
        ta.value = currentUrl;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }
      showToast("URL이 복사되었습니다");
    }

    exportEl.toggleBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = exportEl.dropdown.classList.toggle("open");
      exportEl.toggleBtn.setAttribute("aria-expanded", String(isOpen));
    });

    document.addEventListener("click", (e) => {
      if (!exportEl.dropdown.contains(e.target)) {
        exportEl.dropdown.classList.remove("open");
        exportEl.toggleBtn.setAttribute("aria-expanded", "false");
      }
    });

    exportEl.htmlBtn.addEventListener("click", () => {
      selectedExportType = "html";
      syncExportMenuState();
      triggerHtmlDownload();
      exportEl.dropdown.classList.remove("open");
    });

    exportEl.pdfBtn.addEventListener("click", () => {
      selectedExportType = "pdf";
      syncExportMenuState();
      triggerPdfDownload();
      exportEl.dropdown.classList.remove("open");
    });

    exportEl.downloadBtn.addEventListener("click", () => {
      if (selectedExportType === "pdf") {
        triggerPdfDownload();
      } else {
        triggerHtmlDownload();
      }
      exportEl.dropdown.classList.remove("open");
    });

    exportEl.copyUrlBtn.addEventListener("click", () => {
      copyCurrentUrl();
      exportEl.dropdown.classList.remove("open");
    });

    syncExportMenuState();
  </script>
</body>
</html>
