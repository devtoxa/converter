<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF HTML Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --toolbar-bg: #1e1e1e;
            --border-color: #333333;
            --text-color: #e0e0e0;
            --accent-color: #4dabf7;
            --btn-hover: #2c2c2c;
            --font-nanum: 'Nanum Gothic', 'Malgun Gothic', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-nanum);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 9px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            z-index: 20;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        #file-name {
            font-size: 0.88rem;
            font-weight: 700;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        button {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 9px;
            border-radius: 4px;
            font-family: var(--font-nanum);
            font-size: 0.82rem;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
            user-select: none;
        }

        button:hover:not(:disabled) {
            background-color: var(--btn-hover);
            border-color: #555;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        input[type="number"] {
            background-color: #121212;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 6px;
            width: 52px;
            text-align: center;
            font-family: var(--font-nanum);
            font-size: 0.82rem;
        }

        .page-info,
        .device-label {
            font-size: 0.8rem;
            color: #aaa;
        }

        main {
            flex: 1;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 14px 96px;
            position: relative;
        }

        .device-frame {
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: max-width 0.22s ease, padding 0.22s ease;
        }

        .device-frame.preset-pc {
            max-width: 100%;
        }

        .device-frame.preset-tablet {
            max-width: 720px;
            padding: 14px;
            border: 1px solid #2e2e2e;
            border-radius: 14px;
            background-color: #161616;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        }

        .device-frame.preset-mobile {
            max-width: 336px;
            padding: 10px 8px;
            border: 1px solid #2e2e2e;
            border-radius: 20px;
            background-color: #161616;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
        }

        .pdf-html-page {
            position: relative;
            background-color: #ffffff;
            color: #111111;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            flex-shrink: 0;
            font-family: var(--font-nanum);
        }

        .pdf-vector-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .pdf-image-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .pdf-image-node {
            position: absolute;
            display: block;
            transform-origin: top left;
            pointer-events: none;
        }

        .pdf-text-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            font-family: var(--font-nanum);
        }

        .pdf-text-group {
            position: absolute;
            white-space: pre;
            transform-origin: left bottom;
            line-height: 1;
            cursor: text;
            font-family: var(--font-nanum);
        }

        .pdf-text-run {
            display: inline-block;
            white-space: pre;
            font-family: var(--font-nanum);
        }

        .device-dock {
            position: fixed;
            bottom: 18px;
            right: 18px;
            z-index: 30;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 8px;
        }

        .dock-trigger {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--toolbar-bg);
            border: 1px solid #444;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.65);
        }

        .dock-trigger:hover {
            border-color: var(--accent-color);
            background-color: #252525;
        }

        .dock-menu {
            display: none;
            flex-direction: column;
            gap: 5px;
            background-color: var(--toolbar-bg);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 7px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
        }

        .device-dock.open .dock-menu {
            display: flex;
        }

        .dock-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 11px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-color);
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .dock-option:hover {
            background-color: var(--btn-hover);
            border-color: #444;
        }

        .dock-option.active {
            background-color: rgba(77, 171, 247, 0.16);
            border-color: var(--accent-color);
            color: var(--accent-color);
            font-weight: 700;
        }

        .dock-option svg,
        .dock-trigger svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
        }

        #status-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
            line-height: 1.6;
        }

        #status-message code {
            background: #1e1e1e;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-color);
        }
    </style>
</head>

<body>

    <header>
        <div class="toolbar-group">
            <span id="file-name" title="파일명">path 미지정</span>
        </div>

        <div class="toolbar-group">
            <button id="prev-page" disabled>이전</button>
            <input type="number" id="page-num" value="1" min="1" disabled />
            <span class="page-info">/ <span id="page-count">0</span></span>
            <button id="next-page" disabled>다음</button>
        </div>

        <div class="toolbar-group">
            <span class="device-label" id="current-device-label">화면: PC</span>
            <button id="refit-btn" disabled>화면 맞춤</button>
        </div>
    </header>

    <main id="viewer-container">
        <div id="status-message">
            <p>URL에 <code>?path=...</code> 파라미터를 지정해주세요.</p>
            <p style="margin-top: 8px; font-size: 0.85rem;">
                예시: <code>?path=/.pdf/md_to_pdf.pdf</code>
            </p>
        </div>

        <div id="device-frame" class="device-frame preset-pc"></div>
    </main>

    <!-- 화면 하단 드롭 아이콘 메뉴 -->
    <div id="device-dock" class="device-dock">
        <button id="dock-trigger" class="dock-trigger" title="화면 크기 선택 (PC / 태블릿 / 모바일)" aria-label="화면 크기 선택">
            <svg id="dock-active-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
        </button>

        <div class="dock-menu" role="menu">
            <button class="dock-option active" data-device="pc" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                    <line x1="8" y1="21" x2="16" y2="21"></line>
                    <line x1="12" y1="17" x2="12" y2="21"></line>
                </svg>
                <span>PC</span>
            </button>
            <button class="dock-option" data-device="tablet" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
                <span>태블릿</span>
            </button>
            <button class="dock-option" data-device="mobile" role="menuitem">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
                <span>모바일</span>
            </button>
        </div>
    </div>

    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        const OPS = pdfjsLib.OPS;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const NANUM_FONT = "'Nanum Gothic', 'Malgun Gothic', sans-serif";

        let pdfDoc = null;
        let currentDevice = 'pc'; // 'pc' | 'tablet' | 'mobile'
        let isRendering = false;
        let resizeTimer = null;

        const viewerContainer = document.getElementById('viewer-container');
        const deviceFrame = document.getElementById('device-frame');
        const statusMessage = document.getElementById('status-message');
        const fileNameEl = document.getElementById('file-name');
        const pageNumInput = document.getElementById('page-num');
        const pageCountEl = document.getElementById('page-count');
        const currentDeviceLabel = document.getElementById('current-device-label');

        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const refitBtn = document.getElementById('refit-btn');

        const deviceDock = document.getElementById('device-dock');
        const dockTrigger = document.getElementById('dock-trigger');
        const dockActiveIcon = document.getElementById('dock-active-icon');
        const dockOptions = document.querySelectorAll('.dock-option');

        function getPathParam() {
            const params = new URLSearchParams(window.location.search);
            return params.get('path');
        }

        function enableControls(totalPages) {
            pageCountEl.textContent = totalPages;
            pageNumInput.max = totalPages;
            pageNumInput.disabled = false;
            prevBtn.disabled = false;
            nextBtn.disabled = false;
            refitBtn.disabled = false;
        }

        async function computeFitScale(page) {
            const unscaledViewport = page.getViewport({ scale: 1 });
            let targetWidth;

            if (currentDevice === 'mobile') {
                targetWidth = Math.min(336, viewerContainer.clientWidth - 20) - 16;
            } else if (currentDevice === 'tablet') {
                targetWidth = Math.min(720, viewerContainer.clientWidth - 28) - 28;
            } else {
                targetWidth = viewerContainer.clientWidth - 36;
            }

            targetWidth = Math.max(220, targetWidth);
            return targetWidth / unscaledViewport.width;
        }

        function classifyChar(ch) {
            if (/\s/.test(ch)) return 'space';
            if (/[\uAC00-\uD7A3\u1100-\u11FF\u3130-\u318F]/.test(ch)) return 'hangul';
            if (/[A-Za-z0-9]/.test(ch)) return 'latinNum';
            return 'symbol';
        }

        function splitByCharTypeRuns(text) {
            if (!text) return [];
            const runs = [];
            let currentType = classifyChar(text[0]);
            let currentStr = text[0];

            for (let i = 1; i < text.length; i++) {
                const ch = text[i];
                const t = classifyChar(ch);
                if (t === currentType) {
                    currentStr += ch;
                } else {
                    runs.push({ type: currentType, text: currentStr });
                    currentType = t;
                    currentStr = ch;
                }
            }
            runs.push({ type: currentType, text: currentStr });
            return runs;
        }

        function normalizeRgbArgs(args) {
            if (!args || args.length < 3) return 'rgb(0, 0, 0)';
            const scaleVal = (args[0] <= 1 && args[1] <= 1 && args[2] <= 1) ? 255 : 1;
            const r = Math.round(Math.max(0, Math.min(255, args[0] * scaleVal)));
            const g = Math.round(Math.max(0, Math.min(255, args[1] * scaleVal)));
            const b = Math.round(Math.max(0, Math.min(255, args[2] * scaleVal)));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function grayToRgb(g) {
            const norm = g > 1 ? g / 255 : g;
            const v = Math.round(Math.max(0, Math.min(1, norm)) * 255);
            return `rgb(${v}, ${v}, ${v})`;
        }

        function cmykToRgb(c, m, y, k) {
            const cn = c > 1 ? c / 255 : c;
            const mn = m > 1 ? m / 255 : m;
            const yn = y > 1 ? y / 255 : y;
            const kn = k > 1 ? k / 255 : k;
            const r = Math.round(255 * (1 - cn) * (1 - kn));
            const g = Math.round(255 * (1 - mn) * (1 - kn));
            const b = Math.round(255 * (1 - yn) * (1 - kn));
            return `rgb(${r}, ${g}, ${b})`;
        }

        async function extractImageSrc(page, imgName, args) {
            try {
                let imgData = null;

                if (imgName) {
                    imgData = await new Promise((resolve) => {
                        if (page.objs.has(imgName)) {
                            resolve(page.objs.get(imgName));
                        } else if (page.commonObjs && page.commonObjs.has(imgName)) {
                            resolve(page.commonObjs.get(imgName));
                        } else {
                            page.objs.get(imgName, (data) => resolve(data));
                        }
                    });
                } else if (args && args[0]) {
                    imgData = args[0];
                }

                if (!imgData) return null;

                if (imgData instanceof HTMLImageElement) {
                    return imgData.src || null;
                }
                if (imgData instanceof HTMLCanvasElement) {
                    return imgData.toDataURL('image/png');
                }
                if (imgData.bitmap && typeof ImageBitmap !== 'undefined') {
                    const tmpCanvas = document.createElement('canvas');
                    tmpCanvas.width = imgData.bitmap.width;
                    tmpCanvas.height = imgData.bitmap.height;
                    const tctx = tmpCanvas.getContext('2d');
                    tctx.drawImage(imgData.bitmap, 0, 0);
                    return tmpCanvas.toDataURL('image/png');
                }

                const width = imgData.width;
                const height = imgData.height;
                if (!width || !height) return null;

                const offCanvas = document.createElement('canvas');
                offCanvas.width = width;
                offCanvas.height = height;
                const offCtx = offCanvas.getContext('2d');

                if (imgData.data instanceof Uint8ClampedArray || imgData.data instanceof Uint8Array) {
                    const pixelCount = width * height;
                    const rgba = new Uint8ClampedArray(pixelCount * 4);
                    const src = imgData.data;

                    if (src.length === pixelCount * 4) {
                        rgba.set(src);
                    } else if (src.length === pixelCount * 3) {
                        for (let i = 0, j = 0; i < pixelCount; i++, j += 3) {
                            rgba[i * 4] = src[j];
                            rgba[i * 4 + 1] = src[j + 1];
                            rgba[i * 4 + 2] = src[j + 2];
                            rgba[i * 4 + 3] = 255;
                        }
                    } else if (src.length === pixelCount) {
                        for (let i = 0; i < pixelCount; i++) {
                            const g = src[i];
                            rgba[i * 4] = g;
                            rgba[i * 4 + 1] = g;
                            rgba[i * 4 + 2] = g;
                            rgba[i * 4 + 3] = 255;
                        }
                    } else {
                        return null;
                    }

                    const imageData = new ImageData(rgba, width, height);
                    offCtx.putImageData(imageData, 0, 0);
                    return offCanvas.toDataURL('image/png');
                }
            } catch (_) {
                return null;
            }
            return null;
        }

        // PDF 벡터 경로/사각형(OPS.constructPath 포함), 클리핑, 색상, 이미지 파싱
        async function parsePageGraphics(page, opList, viewport, scale, pageIndex) {
            const svgNS = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(svgNS, 'svg');
            svg.setAttribute('viewBox', `0 0 ${viewport.width} ${viewport.height}`);
            svg.setAttribute('width', viewport.width);
            svg.setAttribute('height', viewport.height);

            const defs = document.createElementNS(svgNS, 'defs');
            svg.appendChild(defs);

            const imageLayer = document.createElement('div');
            imageLayer.className = 'pdf-image-layer';

            const textColorHints = [];

            let ctm = [1, 0, 0, 1, 0, 0];
            const ctmStack = [];
            const clipStack = [];
            let currentClipId = null;
            let clipCounter = 0;

            let currentPath = '';
            let fillColor = 'rgb(0, 0, 0)';
            let strokeColor = 'rgb(0, 0, 0)';
            let fillAlpha = 1;
            let strokeAlpha = 1;
            let lineWidth = 1;

            function applyPoint(x, y) {
                const m = pdfjsLib.Util.transform(viewport.transform, ctm);
                return [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]];
            }

            function appendPathEl(d, fill, stroke, width, fAlpha, sAlpha, clipId) {
                if (!d) return;
                const pathEl = document.createElementNS(svgNS, 'path');
                pathEl.setAttribute('d', d);
                pathEl.setAttribute('fill', fill || 'none');
                if (fill && fill !== 'none' && fAlpha < 1) {
                    pathEl.setAttribute('fill-opacity', fAlpha.toFixed(3));
                }
                pathEl.setAttribute('stroke', stroke || 'none');
                if (stroke && stroke !== 'none') {
                    pathEl.setAttribute('stroke-width', Math.max(0.6, width).toFixed(2));
                    if (sAlpha < 1) {
                        pathEl.setAttribute('stroke-opacity', sAlpha.toFixed(3));
                    }
                }
                if (clipId) {
                    pathEl.setAttribute('clip-path', `url(#${clipId})`);
                }
                svg.appendChild(pathEl);
            }

            function registerClipPath(d) {
                if (!d) return;
                clipCounter += 1;
                const id = `clip-p${pageIndex}-${clipCounter}`;
                const clipEl = document.createElementNS(svgNS, 'clipPath');
                clipEl.setAttribute('id', id);
                const cPath = document.createElementNS(svgNS, 'path');
                cPath.setAttribute('d', d);
                clipEl.appendChild(cPath);
                defs.appendChild(clipEl);
                currentClipId = id;
            }

            // 배치 경로(OPS.constructPath) 처리
            function processConstructPath(subOps, coords) {
                let cIdx = 0;
                let pathStr = '';

                for (const subOp of subOps) {
                    if (subOp === OPS.moveTo) {
                        const [x, y] = applyPoint(coords[cIdx], coords[cIdx + 1]);
                        cIdx += 2;
                        pathStr += `M ${x.toFixed(2)} ${y.toFixed(2)} `;
                    } else if (subOp === OPS.lineTo) {
                        const [x, y] = applyPoint(coords[cIdx], coords[cIdx + 1]);
                        cIdx += 2;
                        pathStr += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
                    } else if (subOp === OPS.curveTo) {
                        const [x1, y1] = applyPoint(coords[cIdx], coords[cIdx + 1]);
                        const [x2, y2] = applyPoint(coords[cIdx + 2], coords[cIdx + 3]);
                        const [x3, y3] = applyPoint(coords[cIdx + 4], coords[cIdx + 5]);
                        cIdx += 6;
                        pathStr += `C ${x1.toFixed(2)} ${y1.toFixed(2)}, ${x2.toFixed(2)} ${y2.toFixed(2)}, ${x3.toFixed(2)} ${y3.toFixed(2)} `;
                    } else if (subOp === OPS.rectangle) {
                        const rx0 = coords[cIdx];
                        const ry0 = coords[cIdx + 1];
                        const rw0 = coords[cIdx + 2];
                        const rh0 = coords[cIdx + 3];
                        cIdx += 4;

                        const [x0, y0] = applyPoint(rx0, ry0);
                        const [x1, y1] = applyPoint(rx0 + rw0, ry0 + rh0);
                        const rx = Math.min(x0, x1);
                        const ry = Math.min(y0, y1);
                        const rw = Math.abs(x1 - x0);
                        const rh = Math.abs(y1 - y0);
                        pathStr += `M ${rx.toFixed(2)} ${ry.toFixed(2)} h ${rw.toFixed(2)} v ${rh.toFixed(2)} h ${(-rw).toFixed(2)} Z `;
                    } else if (subOp === OPS.closePath) {
                        pathStr += 'Z ';
                    }
                }

                return pathStr.trim();
            }

            for (let i = 0; i < opList.fnArray.length; i++) {
                const fn = opList.fnArray[i];
                const args = opList.argsArray[i];

                if (fn === OPS.save) {
                    ctmStack.push([...ctm]);
                    clipStack.push(currentClipId);
                } else if (fn === OPS.restore) {
                    if (ctmStack.length > 0) ctm = ctmStack.pop();
                    currentClipId = clipStack.length > 0 ? clipStack.pop() : null;
                } else if (fn === OPS.transform) {
                    ctm = pdfjsLib.Util.transform(ctm, args);
                } else if (fn === OPS.setGState && Array.isArray(args[0])) {
                    for (const [key, val] of args[0]) {
                        if (key === 'ca' && typeof val === 'number') fillAlpha = val;
                        if (key === 'CA' && typeof val === 'number') strokeAlpha = val;
                    }
                } else if (fn === OPS.setFillRGBColor) {
                    fillColor = normalizeRgbArgs(args);
                } else if (fn === OPS.setStrokeRGBColor) {
                    strokeColor = normalizeRgbArgs(args);
                } else if (fn === OPS.setFillGray) {
                    fillColor = grayToRgb(args[0]);
                } else if (fn === OPS.setStrokeGray) {
                    strokeColor = grayToRgb(args[0]);
                } else if (fn === OPS.setFillCMYKColor) {
                    fillColor = cmykToRgb(args[0], args[1], args[2], args[3]);
                } else if (fn === OPS.setStrokeCMYKColor) {
                    strokeColor = cmykToRgb(args[0], args[1], args[2], args[3]);
                } else if (fn === OPS.setLineWidth) {
                    lineWidth = (args[0] || 1) * scale;
                } else if (fn === OPS.constructPath) {
                    const built = processConstructPath(args[0] || [], args[1] || []);
                    if (built) {
                        currentPath = currentPath ? `${currentPath} ${built}` : built;
                    }
                    const minX = args[2] ? args[2][0] : null;
                    if (typeof minX === 'number' && args[2].length >= 4) {
                        // minMax 영역이 함께 넘어오는 경우(일부 PDF.js 버전)
                    }
                } else if (fn === OPS.moveTo) {
                    const [x, y] = applyPoint(args[0], args[1]);
                    currentPath += `M ${x.toFixed(2)} ${y.toFixed(2)} `;
                } else if (fn === OPS.lineTo) {
                    const [x, y] = applyPoint(args[0], args[1]);
                    currentPath += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
                } else if (fn === OPS.curveTo) {
                    const [x1, y1] = applyPoint(args[0], args[1]);
                    const [x2, y2] = applyPoint(args[2], args[3]);
                    const [x3, y3] = applyPoint(args[4], args[5]);
                    currentPath += `C ${x1.toFixed(2)} ${y1.toFixed(2)}, ${x2.toFixed(2)} ${y2.toFixed(2)}, ${x3.toFixed(2)} ${y3.toFixed(2)} `;
                } else if (fn === OPS.rectangle) {
                    const [x0, y0] = applyPoint(args[0], args[1]);
                    const [x1, y1] = applyPoint(args[0] + args[2], args[1] + args[3]);
                    const rx = Math.min(x0, x1);
                    const ry = Math.min(y0, y1);
                    const rw = Math.abs(x1 - x0);
                    const rh = Math.abs(y1 - y0);
                    currentPath += `M ${rx.toFixed(2)} ${ry.toFixed(2)} h ${rw.toFixed(2)} v ${rh.toFixed(2)} h ${(-rw).toFixed(2)} Z `;
                } else if (fn === OPS.closePath) {
                    currentPath += 'Z ';
                } else if (fn === OPS.clip || fn === OPS.eoClip) {
                    registerClipPath(currentPath.trim());
                } else if (fn === OPS.fill || fn === OPS.eoFill) {
                    appendPathEl(currentPath.trim(), fillColor, 'none', 0, fillAlpha, strokeAlpha, currentClipId);
                    currentPath = '';
                } else if (fn === OPS.stroke) {
                    appendPathEl(currentPath.trim(), 'none', strokeColor, lineWidth, fillAlpha, strokeAlpha, currentClipId);
                    currentPath = '';
                } else if (fn === OPS.fillStroke || fn === OPS.eoFillStroke) {
                    appendPathEl(currentPath.trim(), fillColor, strokeColor, lineWidth, fillAlpha, strokeAlpha, currentClipId);
                    currentPath = '';
                } else if (fn === OPS.endPath) {
                    currentPath = '';
                } else if (fn === OPS.showText || fn === OPS.showSpacedText) {
                    const m = pdfjsLib.Util.transform(viewport.transform, ctm);
                    textColorHints.push({
                        x: m[4],
                        y: m[5],
                        color: fillColor
                    });
                } else if (fn === OPS.paintImageXObject || fn === OPS.paintInlineImageXObject) {
                    const imgName = fn === OPS.paintImageXObject ? args[0] : null;
                    const src = await extractImageSrc(page, imgName, args);
                    if (src) {
                        const m = pdfjsLib.Util.transform(viewport.transform, ctm);
                        const w = Math.max(1, Math.hypot(m[0], m[1]));
                        const h = Math.max(1, Math.hypot(m[2], m[3]));
                        const angleDeg = (Math.atan2(m[1], m[0]) * 180) / Math.PI;

                        const imgEl = document.createElement('img');
                        imgEl.className = 'pdf-image-node';
                        imgEl.src = src;
                        imgEl.alt = imgName || 'PDF image';
                        imgEl.style.left = `${m[4].toFixed(2)}px`;
                        imgEl.style.top = `${(m[5] - h).toFixed(2)}px`;
                        imgEl.style.width = `${w.toFixed(2)}px`;
                        imgEl.style.height = `${h.toFixed(2)}px`;
                        if (Math.abs(angleDeg) > 0.1) {
                            imgEl.style.transform = `rotate(${angleDeg.toFixed(2)}deg)`;
                        }
                        imageLayer.appendChild(imgEl);
                    }
                }
            }

            return { svg, imageLayer, textColorHints };
        }

        function buildTextDomLayer(textContent, viewport, scale, textColorHints) {
            const textLayer = document.createElement('div');
            textLayer.className = 'pdf-text-layer';

            const measureCanvas = document.createElement('canvas');
            const mctx = measureCanvas.getContext('2d');

            const items = textContent.items || [];
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (!item.str) continue;

                const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                const fontHeight = Math.hypot(tx[2], tx[3]) || Math.abs(item.height * scale) || 12;
                const angleDeg = (Math.atan2(tx[1], tx[0]) * 180) / Math.PI;
                const totalTargetWidth = Math.abs((item.width || 0) * scale);

                const groupEl = document.createElement('span');
                groupEl.className = 'pdf-text-group';
                groupEl.style.left = `${tx[4].toFixed(2)}px`;
                groupEl.style.top = `${(tx[5] - fontHeight).toFixed(2)}px`;
                groupEl.style.fontSize = `${fontHeight.toFixed(2)}px`;
                groupEl.style.fontFamily = NANUM_FONT;

                // 글자 색상 매칭 (가까운 showText/showSpacedText 채우기 색상 우선)
                let bestColor = null;
                let bestDist = Infinity;
                for (const hint of textColorHints) {
                    const d = Math.hypot(hint.x - tx[4], hint.y - tx[5]);
                    if (d < bestDist && d < fontHeight * 3.0) {
                        bestDist = d;
                        bestColor = hint.color;
                    }
                }
                if (bestColor) {
                    groupEl.style.color = bestColor;
                }

                const runs = splitByCharTypeRuns(item.str);
                mctx.font = `${fontHeight.toFixed(2)}px ${NANUM_FONT}`;

                const measuredWidths = runs.map(r => mctx.measureText(r.text).width);
                const sumMeasured = measuredWidths.reduce((acc, w) => acc + w, 0);

                for (let rIdx = 0; rIdx < runs.length; rIdx++) {
                    const run = runs[rIdx];
                    const runEl = document.createElement('span');
                    runEl.className = 'pdf-text-run';
                    runEl.textContent = run.text;

                    const mWidth = measuredWidths[rIdx];
                    if (totalTargetWidth > 0 && sumMeasured > 0 && mWidth > 0 && run.type !== 'space') {
                        const targetRunWidth = totalTargetWidth * (mWidth / sumMeasured);
                        const diffPx = targetRunWidth - mWidth;

                        if (run.text.length > 1) {
                            const perGap = diffPx / (run.text.length - 1);
                            if (perGap >= -1.2 && perGap <= 2.2) {
                                runEl.style.letterSpacing = `${perGap.toFixed(2)}px`;
                            } else {
                                const scaleX = Math.max(0.7, Math.min(1.45, targetRunWidth / mWidth));
                                runEl.style.transformOrigin = 'left center';
                                runEl.style.transform = `scaleX(${scaleX.toFixed(3)})`;
                            }
                        } else if (run.type === 'symbol') {
                            const sidePad = Math.max(-1.2, Math.min(2.0, diffPx / 2));
                            if (Math.abs(sidePad) > 0.15) {
                                runEl.style.marginLeft = `${sidePad.toFixed(2)}px`;
                                runEl.style.marginRight = `${sidePad.toFixed(2)}px`;
                            }
                        }
                    }

                    groupEl.appendChild(runEl);
                }

                if (Math.abs(angleDeg) > 0.1) {
                    groupEl.style.transform = `rotate(${angleDeg.toFixed(2)}deg)`;
                }

                textLayer.appendChild(groupEl);
            }

            return textLayer;
        }

        async function renderAllPages() {
            if (!pdfDoc || isRendering) return;
            isRendering = true;

            const activePage = parseInt(pageNumInput.value, 10) || 1;
            deviceFrame.innerHTML = '';

            try {
                for (let num = 1; num <= pdfDoc.numPages; num++) {
                    const page = await pdfDoc.getPage(num);
                    const scale = await computeFitScale(page);
                    const viewport = page.getViewport({ scale });

                    const pageEl = document.createElement('section');
                    pageEl.className = 'pdf-html-page';
                    pageEl.dataset.pageNumber = num;
                    pageEl.style.width = `${viewport.width}px`;
                    pageEl.style.height = `${viewport.height}px`;

                    const opList = await page.getOperatorList();
                    const textContent = await page.getTextContent();

                    const { svg, imageLayer, textColorHints } = await parsePageGraphics(
                        page,
                        opList,
                        viewport,
                        scale,
                        num
                    );

                    const vectorWrapper = document.createElement('div');
                    vectorWrapper.className = 'pdf-vector-layer';
                    vectorWrapper.appendChild(svg);

                    const textLayer = buildTextDomLayer(
                        textContent,
                        viewport,
                        scale,
                        textColorHints
                    );

                    pageEl.appendChild(vectorWrapper);
                    pageEl.appendChild(imageLayer);
                    pageEl.appendChild(textLayer);
                    deviceFrame.appendChild(pageEl);
                }

                if (activePage > 1) {
                    scrollToPage(activePage, 'auto');
                }
            } finally {
                isRendering = false;
            }
        }

        function setDevice(device) {
            currentDevice = device;
            deviceFrame.className = `device-frame preset-${device}`;

            const labelMap = {
                pc: '화면: PC',
                tablet: '화면: 태블릿',
                mobile: '화면: 모바일'
            };
            currentDeviceLabel.textContent = labelMap[device] || '화면: PC';

            dockOptions.forEach(opt => {
                const isSelected = opt.dataset.device === device;
                opt.classList.toggle('active', isSelected);
                if (isSelected) {
                    const svgEl = opt.querySelector('svg');
                    if (svgEl) {
                        dockActiveIcon.innerHTML = svgEl.innerHTML;
                    }
                }
            });

            deviceDock.classList.remove('open');

            if (pdfDoc) {
                renderAllPages();
            }
        }

        async function loadPdfFromPath(pdfPath) {
            const displayName = decodeURIComponent(pdfPath.split('/').pop().split('?')[0] || 'document.pdf');
            try {
                statusMessage.style.display = 'block';
                statusMessage.innerHTML = '<p>PDF를 HTML로 불러오는 중입니다...</p>';
                fileNameEl.textContent = displayName;
                fileNameEl.title = pdfPath;
                document.title = `${displayName} - PDF HTML Viewer`;

                const loadingTask = pdfjsLib.getDocument(pdfPath);
                pdfDoc = await loadingTask.promise;

                statusMessage.style.display = 'none';
                enableControls(pdfDoc.numPages);
                await renderAllPages();
            } catch (err) {
                console.error(err);
                statusMessage.style.display = 'block';
                statusMessage.innerHTML = `
          <p style="color: #ff6b6b;">PDF를 불러오는 데 실패했습니다.</p>
          <p style="font-size: 0.85rem; margin-top: 6px;"><code>${pdfPath}</code> 경로를 확인해주세요.<br>(${err.message})</p>
        `;
            }
        }

        function scrollToPage(num, behavior = 'smooth') {
            const target = deviceFrame.querySelector(`.pdf-html-page[data-page-number="${num}"]`);
            if (target) {
                target.scrollIntoView({ behavior, block: 'start' });
                pageNumInput.value = num;
            }
        }

        dockTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            deviceDock.classList.toggle('open');
        });

        dockOptions.forEach(opt => {
            opt.addEventListener('click', (e) => {
                e.stopPropagation();
                setDevice(opt.dataset.device);
            });
        });

        document.addEventListener('click', () => {
            deviceDock.classList.remove('open');
        });

        viewerContainer.addEventListener('scroll', () => {
            const pages = document.querySelectorAll('.pdf-html-page');
            const containerTop = viewerContainer.getBoundingClientRect().top;

            for (const page of pages) {
                const rect = page.getBoundingClientRect();
                if (rect.top <= containerTop + 150 && rect.bottom >= containerTop + 150) {
                    pageNumInput.value = page.dataset.pageNumber;
                    break;
                }
            }
        });

        prevBtn.addEventListener('click', () => {
            const current = parseInt(pageNumInput.value, 10);
            if (current > 1) scrollToPage(current - 1);
        });

        nextBtn.addEventListener('click', () => {
            const current = parseInt(pageNumInput.value, 10);
            if (pdfDoc && current < pdfDoc.numPages) scrollToPage(current + 1);
        });

        pageNumInput.addEventListener('change', () => {
            if (!pdfDoc) return;
            let val = parseInt(pageNumInput.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            if (val > pdfDoc.numPages) val = pdfDoc.numPages;
            scrollToPage(val);
        });

        refitBtn.addEventListener('click', () => {
            if (pdfDoc) renderAllPages();
        });

        window.addEventListener('resize', () => {
            if (!pdfDoc) return;
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                renderAllPages();
            }, 150);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const pdfPath = getPathParam();
            if (pdfPath) {
                loadPdfFromPath(pdfPath);
            }
        });
    </script>
</body>

</html>
